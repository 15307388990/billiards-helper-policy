name: Clear stalled policy Pages deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/clear-stalled-pages.yml]
permissions: {}
jobs:
  clear-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pages: write
    steps:
      - name: Cancel only the identified stalled deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/15307388990/billiards-helper-policy/pages/deployments/3e91691b859a3374e21813b0e65867e99e5c740a/cancel"
